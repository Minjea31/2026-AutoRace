# 04번 실차 덮어쓰기(launch car:=04). 근거: 메모 car-04 / objavoid_test real_car04.yaml(2026-11-13 bag 분석)
objavoid_v3_node:
  ros__parameters:
    w_dkappa: 0.002
    obstacle_fixed_size: true
    obstacle_min_length: 0.322
    obstacle_min_width: 0.22
    v_max: 0.2               # 첫 실차 시험은 낮게
    curve_slow: 0.1
    ff_preview_time: 0.2
    # 04번 카메라 바닥 투영: camera_info(fx 487.3, cx 321.5, cy 220.4) + 장착(앞 0.133, 좌 -0.05, 높이 0.21 m)
    #   + 콘 238쌍으로 맞춘 숙임 1.5°·yaw 1.4°, 오차 중앙값 3.4 cm(06번 BEV 값은 25 cm)
    ground_homography: [-2.47236832e-05, -0.000614188775, -0.357702092, 0.00101162912, 0.000241500626, -0.387454879, 0.0, -0.00481706871, 1.0]
    # 04번 /odom: 회전 미확인(06번은 IMU의 2배), 거리 약 8% 짧음 -> 방향은 IMU, 위치는 odom 속도 x 1.08
    yaw_source: imu
    imu_topic: /imu
    odom_scale: 1.08
    # 내부 자세가 드라이버 odom TF와 다르므로 마커는 차체 기준으로 표시(RViz 고정 프레임 base_link)
    marker_frame: base_link
    # Full-image deep-only evidence, sampled every 2 pixels; retain only 2m ahead.
    lane_full_image: true
    lane_max_range: 2.0
    lane_max_lateral: 1.5
    lane_align_max: 0.35        # 활성화는 도로와 거의 나란한 자세에서(뒤쪽 콘 줄 등 오인 방지)
    lane_align_min_len: 0.4      # 04번 시야에서 한 번에 보이는 외곽선이 짧음(약 0.45 m)
    # 실차 트랙에는 시뮬 입구 깔때기가 없음: 사전 경계를 처음부터 3차로 폭(±0.768)으로
    boundary_s: [-1.0, 4.25, 4.75, 8.0]      # 갈림길: 표지판 받침(약 5.5 m) 너머 갈래 안까지 경로를 그리도록(5.8이면 받침 앞에서 끝남)
    # 실차 트랙: 차로 폭 0.50 m(사용자 실측) -> 3차로 노란선 안쪽 ±0.75
    #   04번 카메라는 같은 점선 간격을 0.57 m, 외곽선을 0.86 m로 잼(좌우 약 14% 과대) -> 좌우 0.877 보정
    ground_scale: [1.0, 0.877]
    boundary_left: [0.75, 0.75, 0.77, 0.77]
    boundary_right: [-0.75, -0.75, -0.77, -0.77]
    lane_centers: [-0.5, 0.0, 0.5]
    lane_dash_offset: 0.25
    lane_pair_widths: [0.5, 1.5]
    lane_island: false          # 실차 배치 미확인: 섬 검출로 구간 끝을 바꾸지 않음(오검출 시 3.5 m로 줄었음)
    lane_align_tol: 0.05
    lane_center_tol: 0.06
    # 11-15: 통합 실행에서 센서를 steering_command_calibration:=true로 띄우면 차선 주행(lane PID)이 망가짐 ->
    #   센서는 보정 없이(기본) 띄우고, V3 명령만 노드 안에서 드라이버 보정식과 같은 서보 값이 되도록 변환.
    #   아래 조향 설명의 '보정 켬'은 이 변환으로 그대로 재현됨. 센서 보정을 다시 켜면 이 값을 false로.
    cmd_emulate_calibration: true
    # 자동 시작: slow/bump 미션 밖에서 노란 입구 꺾임 연속 확인 + 전방 장애물 2개.
    # 11-17 174119 bag: 기존 흰 점선 조건은 라바콘에서도 성립하므로 04번에서는 끈다.
    start_need_line: false
    # 11-15: 갈림길 단순화(사용자) — A/B 결정 위치에서 fork_turn_after 더 간 뒤 그쪽으로 fork_turn_steer 로
    #   fork_turn_dist 꺾고 DONE(lane에 넘김). 표지판 받침·섬 추정 안 씀. 세 값은 실차에서 맞출 것.
    fork_turn: false
    fork_shape: true
    fork_sign_min: 1  # YOLO has already confirmed this direction
    road_outline: true
    start_entrance: true
    start_entrance_confirm: 2  # 노란 입구 꺾임을 새 영상 2장 연속 확인하면 시작 허용
    start_legacy: false       # 흰 점선 + 물체만으로 자동 시작하지 않음
    # 11-15 10:05 시작 지점에서 오작동(점선 L0 R2 + 정면 물체): 점선 조각이 좌우 모두 있고 간격이 차로 폭(0.5 ± 0.12 m)일 때만
    lane_rate: 10.0          # 시작 판정 주기: 5 → 10Hz
    start_dash_both: true
    start_obs_min: 2           # 시작 통로 안의 장애물 2개 이상
    start_confirm: 1           # 점선·장애물 조건을 만족한 첫 판정에 시작
    start_after_crosswalk: false  # 횡단보도 선행 조건 없음
    # 04번 조향(2026-11-14 bag 3개): 센서 런치 기본(steering_command_calibration=false + offset 0.04 -> 서보 0.35 제한)
    #   에서는 실제 곡률이 명령의 0.35배(반경 약 1.2 m). 센서를 steering_command_calibration:=true로 띄우는 것을 전제로
    #   서보 모델 한계(안쪽 바퀴 0.44 -> 중심 약 0.37 rad, 반경 약 0.52 m)에 여유를 둔 값.
    #   보정을 켜지 않으면: steer_gain 2.8, max_steering 0.44, plan_min_radius 1.25, escape/observe 1.2로 바꿔야 함.
    # 11-14 21:46 bag(보정 켬): 오른쪽 최대가 드라이버에서 잘림(중립 보정 0.04를 서보 한계 0.35 안에서 더함):
    #   명령 -0.37 -> 실제 -0.28(반경 0.70 m), +0.37 -> +0.40(0.50 m).
    # 21:59 bag: 상수 쏠림 보정(steer_trim)은 역효과 — 드라이버 데드밴드 보정이 0 근처에서 서보 값을 ±0.12씩 건너뛰어
    #   직진 명령 -0.045가 실제 오른쪽 -0.06~-0.08이 됨. steer_trim은 0으로 둘 것.
    # 22:04 이후: 사용자 결정으로 sensor_ws 04번 중립 보정 0.04 -> 0.01(오른쪽 한계 약 -0.33 예상). 그 기준 반경.
    #   다음 bag에서 오른쪽 최대가 여전히 -0.3보다 약하면 plan_min_radius 0.65, escape/observe 0.62로.
    # 11-14 23:17~23:50 bag 5개 실측(보정 0.01): 명령 +0.37 -> 실제 +0.39(반경 0.49 m), -0.37 -> -0.30(0.66 m).
    #   최악 배치(23:50 3단 슬라롬: 0.7 m 안에 차로 2개 전환)를 앞으로만 통과하려면 크게 꺾어야 함 ->
    #   좌우 계획 반경을 따로(왼쪽 0.5, 오른쪽 0.62), 방향각 한계 0.9 -> 1.25 rad, 명령 상한 0.45(오른쪽 서보 끝까지).
    #   시뮬(실차 좌우 한계·0.3 s 지연 모델)에서 slalom3·default7 통과, 회귀 20개 충돌 0.
    # 11-15 01:01 수동 주행(리모컨): 후진 없이 3차선->1차선->3차선, 헤딩 76°(1.32 rad), 반경 좌 0.46 / 우 0.40 m.
    #   ROS 명령은 드라이버 서보 상한(steering_command_limit)에서 잘림: 0.35 -> 우 0.74 m, 0.38 -> 우 0.61 m.
    #   0.42면 리모컨과 같은 각(안쪽 0.42x1.92-0.23=0.58 rad -> 반경 약 0.40 m). 아래 값은 0.42 전제
    #   (센서: steering_command_limit:=0.42). 0.38로 띄우면 우 0.65/0.63, 0.35면 우 0.75/0.74로 되돌릴 것.
    #   시뮬 slalom_rlr(수동 배치)·slalom3·slalom_lr·default7 후진 없이 통과(좌우 0.45/0.43 rad·0.3 s 지연 모델).
    # 11-15: 서보 상한 0.48 시험용. 명령 0.6이면 오른쪽 서보 값이 -(0.74+0.23)/1.92+0.01 = -0.49 -> 상한 -0.48까지 닿음
    #   (0.5면 -0.43에서 멈춤). 왼쪽은 이미 기계 한계(+0.40 rad)라 더 꺾이지 않음.
    # 11-15 01:31 bag: 센서 steering_command_limit:=0.48 + 아래 값으로 수동 개입 없이 3단 슬라롬 통과(정지 0, 계획 실패 0).
    #   이 설정은 상한 0.48 전제. 명령 -0.47 -> 실제 -0.34, +0.52 -> +0.44.
    max_steering: 0.7
    steer_gain: 1.0
    steer_trim: 0.0
    plan_min_radius: 0.6        # 속도 감속 기준(좌우 반경은 아래)
    # 11-15 01:21 bag(상한 0.42): 명령 -0.5 -> 실제 -0.34(반경 0.58 m), +0.5 -> +0.40(0.48 m). 리모컨(우 0.40 m)만큼은 안 나옴
    plan_min_radius_left: 0.4   # 0.4는 실측(좌 0.48 / 우 0.58 m)보다 작아 못 따라감
    plan_min_radius_right: 0.4
    max_heading: 1.55
    escape_min_radius: 0.5
    escape_min_radius_left: 0.48
    escape_min_radius_right: 0.58
    observe_min_radius: 0.55
    # 여유: 0.04/0.18이면 default7·3단 슬라롬이 후진 없이 막힘 -> 0.03/0.15(22:04의 0.025/0.12보다는 넓게)
    margin_obstacle: 0.03
    clearance_soft: 0.18        # 11-15 차에서 조정한 값 유지
    # 뒷바퀴가 지난 콘에 스침: 지난 장애물을 더 오래 기억(0.08 -> 0.2, 차 뒤끝 판정도 가장 뒤 모서리 기준으로 수정)
    pass_margin: 0.2
    # 11-15 차에서 조정한 값(공통 objavoid_v3.yaml에서 04번 설정으로 옮김)
    max_steering_rate: 1.3
    v_min: 0.1
    # 일반 장애물 후진은 끔. fork_shape의 노란 경계 전용 20cm 후진은 별도 조건으로 동작.
    reverse_enable: false
    k_psi: 1.4
    fb_limit: 0.30
    scan_timeout: 0.6           # 실차 LiDAR 6.5~10 Hz, 가끔 0.4 s 넘는 간격
    reverse_dist: 0.20
