objavoid_node:
  ros__parameters:
    use_sim_time: false
    manual_active: true
    start_x_min: 0.0
    start_x_max: 2.5
    start_y_min: -0.75
    start_y_max: 0.75
    start_minimum_objects: 2
    start_image_timeout: 0.3
    white_image_topic: /camera/color/image_raw/compressed
    lane_white_config: ''
    white_s_max: 70
    white_v_min: 120
    white_roi_left: 0.2
    white_roi_right: 0.8
    white_roi_top: 0.86
    white_roi_bottom: 0.92
    white_roi_minimum_ratio: 0.08
    scan_topic: /scan
    lane_target_topic: /lane_deep/target
    command_topic: /mission/objavoid/command_05
    front_half_angle_deg: 25.0
    side_limit_angle_deg: 90.0
    far_distance: 2.5
    roi_half_width: 0.75
    priority_half_angle_deg: 35.0
    near_distance: 0.5
    cruise_speed: 0.45
    avoid_speed: 0.3
    near_speed: 0.2
    max_avoid_steering: 0.6981317008  # 40 degrees
    lane_gain: 0.8
    max_lane_steering: 0.35
    scan_timeout: 0.0  # Use the last valid scan continuously; receive health is reported separately.
    lane_timeout: 0.5
    future_tolerance: 0.05
    publish_rate: 20.0
    lidar_yaw_deg: 0.0
    inf_is_clear: false
    wheelbase: 0.2
    preview_distance: 0.5
    max_preview_distance: 1.0
    cluster_jump_distance: 0.12
    cluster_min_points: 3
    cluster_max_distance: 3.5
    object_max_extent: 1.0
    vehicle_length: 0.322
    vehicle_width: 0.22
    lidar_x: 0.103
    lidar_y: 0.0
    clearance_margin: 0.05
    visual_road_distance: 2.5
    lane_width: 0.52
    lane_mask_topic: /lane_fusion/deep_mask
    # Local read-only debug viewer; camera overlay uses deep lane ground BEV.
    web_enabled: true
    web_host: 127.0.0.1
    web_port: 8085
    # Empty = bundled real-car calibration. Set the deep lane YAML path for sim/custom calibration.
    web_lane_config: ''
