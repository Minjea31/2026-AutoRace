  height: 480
  roi_top: 0.55
  roi_bottom: 1.0
  roi_left: 0.0
  roi_right: 1.0
  bev_top_y: 0.567
  bev_bottom_y: 0.962
  bev_top_left: 0.126
  bev_top_right: 0.892
  bev_bottom_left: -1.001
  bev_bottom_right: 1.959
  yellow_enabled: 0
  yellow_h_min: 15
  yellow_h_max: 40
  yellow_s_min: 80
  yellow_v_min: 80
  white_enabled: 0
  white_s_max: 26
  white_v_min: 235
  white_tophat: 30
  white_max_width: 26
  white_max_length: 190
  line_width_max: 24
  min_area: 35
  max_residual: 6
  histogram_start: 0.5
  windows: 12
  margin: 30
  min_pixels: 18
  max_misses: 3
  min_windows: 3
  deep_max_age: 0.2
  merge_px: 24
  lane_width_px: 277
  width_tolerance: 0.35
  max_angle_deg: 30
  vehicle_center_u: 0.5
  lookahead_row: 0.55
  smoothing: 0.6
  track_jump_px: 35
  track_memory: 0.5
  role_frames: 3
  cone_exit_role_bias: 0.8  # only while fresh /cone_lane/exit_lane_active + a coherent recent turn
