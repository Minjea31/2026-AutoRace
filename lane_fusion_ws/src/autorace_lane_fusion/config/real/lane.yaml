# Car 06: deep-only lane; HSV detector disabled (2026-11-18).
# REAL CAR ONLY. Tune with: lane_lite_tuner --profile real --bag <bag>
# (Save YAML writes back to this source file; rebuild to install it).
# BEV measured with tape on car 06 (2026-11-07, lane_ws/BEV1 .yaml): ground marks
# 0.50 m (+/-0.20 m) and 1.20 m (+/-0.30 m) ahead of the front axle, then widened
# to a 1.20 m x 0.90 m ground rectangle (0.39-1.29 m ahead of the front axle,
# square 1.88 mm/px). bev_near_m / bev_far_m are from base_link (front axle
# - wheelbase/2 = 0.10 m). Lane 0.52 m centre-to-centre -> ~277 px (11-04
# slow/fast bags learn ~285 px). Pixel-size parameters (and deep_dilate) were scaled by 0.59
# from the old 470 px BEV. Old values: lane_real_before_bev1 (git history).
# Copied from lane_ws commit 0867daa.
# 2026-11-07: single deep-first fusion pipeline (deep_mode / sliding-window keys removed).
# 2026-11-10: asynchronous candidate fusion. HSV (lane_ws detector) every frame, deep masks aligned with
#   odometry (deep_max_age), candidates chosen by geometry only. Removed: cell chains, hsv_min_quality,
#   hsv_penalty, max_target_jump_m (old YAML with these keys still loads).
# 2026-11-12: fork (A/B, /yolo/LR_sign) logic removed from the lane node (to be redone).
lane_lite:
  width: 640
  height: 480
  roi_top: 0.55
  roi_bottom: 1.0
  roi_left: 0.0
  roi_right: 1.0
  bev_top_y: 0.567
  bev_bottom_y: 0.962
  bev_top_left: 0.126
  bev_top_right: 0.892
  bev_bottom_left: -1.001
  bev_bottom_right: 1.959
  yellow_enabled: 0
  yellow_h_min: 15
  yellow_h_max: 40
  yellow_s_min: 80
  yellow_v_min: 80
  white_enabled: 0
  white_s_max: 70
  white_v_min: 120
  white_tophat: 30
  white_max_width: 26
  white_max_length: 190
  line_width_max: 24
  min_area: 35
  max_residual: 6
  histogram_start: 0.5
  windows: 12
  margin: 30
  min_pixels: 18
  max_misses: 3
  min_windows: 3
  deep_max_age: 0.2
  merge_px: 24
  lane_width_px: 277
  width_tolerance: 0.35
  max_angle_deg: 30
  vehicle_center_u: 0.5
  lookahead_row: 0.55
  smoothing: 0.6
  track_jump_px: 35
  track_memory: 0.5
  role_frames: 3
  cone_exit_role_bias: 0.8  # only while fresh /cone_lane/exit_lane_active + a coherent recent turn
  max_curvature: 3.0
  curvature_span_m: 0.6
  lane_width_m: 0.52
  curve_lane_width_m: 0.67  # 2026-11-11: right-hand bends are up to 0.67 m wide (left line only in view)
  curve_angle_deg: 45
  curve_memory: 2.0  # 2026-11-11: after a bend the lane just driven runs parallel outside the left line
  bev_near_m: 0.49
  bev_far_m: 1.39
