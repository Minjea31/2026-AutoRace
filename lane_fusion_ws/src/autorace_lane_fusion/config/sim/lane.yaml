# SIMULATOR ONLY, default camera (simul.sh / run.sh without --lane-camera).
# BEV = the metric ground rectangle X=0.67..1.768 m from base_link generated by
# simul/tools/prepare_lane_pd.py (same corners as autorace_lane_single sim_pd.yaml):
# 0.55 m lane = 240 px in both BEV axes. White stays enabled for the dashed
# lane lines of the lower 3-lane section (0.20 m dash / 0.15 m gap).
# 2026-11-07: single deep-first fusion pipeline (deep_mode / sliding-window keys removed).
lane_lite:
  width: 640
  height: 480
  roi_top: 0.45
  roi_bottom: 1.0
  roi_left: 0.0
  roi_right: 1.0
  bev_top_y: 0.660519429098392
  bev_bottom_y: 0.9886451553241162
  bev_top_left: 0.1640677401306896
  bev_top_right: 0.7929844679563341
  bev_bottom_left: -0.5226280533405224
  bev_bottom_right: 1.3918885499170437
  yellow_enabled: 1
  yellow_h_min: 15
  yellow_h_max: 40
  yellow_s_min: 80
  yellow_v_min: 80
  white_enabled: 1
  white_s_max: 70
  white_v_min: 120
  white_tophat: 30
  white_max_width: 0
  white_max_length: 0
  line_width_max: 30
  min_area: 60
  max_residual: 5
  histogram_start: 0.5
  windows: 12
  margin: 45
  min_pixels: 25
  max_misses: 3
  min_windows: 3
  deep_max_age: 0.2
  merge_px: 20
  lane_width_px: 240
  width_tolerance: 0.35
  max_angle_deg: 30
  vehicle_center_u: 0.5
  lookahead_row: 0.55
  smoothing: 0.6
  track_jump_px: 50
  track_memory: 0.5
  role_frames: 3
  max_curvature: 3.0
  curvature_span_m: 0.6
  lane_width_m: 0.55
  bev_near_m: 0.67
  bev_far_m: 1.767708
