parking_node:
  ros__parameters:
    # Fixed in the mission-start frame; these bounds select candidate points only.
    candidate_roi_enabled: true
    candidate_roi_forward_min: 0.0
    candidate_roi_forward_max: 3.0
    candidate_roi_right_min: 0.2
    candidate_roi_right_max: 2.0
    recognition_frames: 3
    obstacle_memory_enabled: true
    sign_timeout: 0.5
    scan_timeout: 0.5
    base_frame: base_link
    lidar_frame: laser_link
    lidar_x: 0.103
    lidar_y: 0.0
    lidar_yaw: 0.0
    cluster_distance: 0.12
    cluster_min_points: 3
    max_range: 3.0
    min_cluster_size: 0.14
    # Close signs jitter above 10 cm. Preserve small, distant parking obstacles.
    obstacle_min_cluster_size: 0.12
    small_cluster_filter_max_distance: 1.0
    max_cluster_size: 0.65
    row_yaw: 0.0
    row_tolerance: 0.16
    # Edge-to-edge slot width: 0.30 m (body + margins) through 0.70 m.
    # Candidate lateral centers must align within row_tolerance (16 cm).
    min_gap: 0.30
    max_gap: 0.80
    vehicle_length: 0.322
    vehicle_width: 0.22
    wheelbase: 0.2
    # Nominal command geometry is 40 cm; response calibration expands planned arcs.
    # Central and inner-wheel steering angles describe the same Ackermann radius.
    max_steering: 0.4636476090008061
    max_inner_steering: 0.5671412488145694
    steering_track: 0.172
    # LiDAR sees the parked cars' front faces, not their full footprints.
    # Target is the center of the measured gap; do not push it into the bay.
    goal_from_observed_front: false
    clearance: 0.10
    initial_clear_radius: 0.3
    # Operator-selected policy: unobserved/zero-range sectors are assumed free.
    assume_unobserved_free: true
    allow_reverse: true
    recovery_uses_memory_map: true
    recovery_min_distance: 0.20
    recovery_reverse_distance: 0.30
    recovery_on_front_obstacle_only: true
    recovery_on_path_failure: true
    recovery_failure_count: 3
    recovery_total_distance: 1.50
    recovery_front_clearance: 0.10
    recovery_left_when_goal_right: false
    recovery_straight_distance: 0.10
    recovery_speed: 0.2
    # User-confirmed clear rear space; mission-total blind reverse allowance.
    blind_reverse_distance: 0.30
    max_recovery_attempts: 5
    parking_speed: 0.25
    min_turn_speed: 0.2
    parking_hold_seconds: 3.0
    exit_heading_tolerance: 0.05
    max_deceleration: 1.0
    max_yaw_rate: 1.5
    lookahead: 0.20
    control_hz: 20.0
    visualization_period: 0.10
    plan_period: 0.30
    planning_timeout: 0.60
    localization_source: fused
    localization_topic: /odometry/filtered
    localization_timeout: 0.3
    localization_max_stddev: 0.5
    goal_tolerance: 0.035
    goal_yaw_tolerance: 0.12
    odom_frame: parking_odom
    min_turn_radius: 0.53
    # Allow wider curves and refine the goal while maintaining an active route.
    preferred_turn_radius: 0.0
    max_steering_paths_only: false
    # Follow the current segment: zero on straights, full signed steering on arcs.
    max_steering_on_curves: false
    steering_gain: 2.0
    curvature_feedforward: true
    steering_preview_time: 0.25
    # Nov 8 manual curve: measured radius about 0.506 m. The matching driver
    # command calibration restores physical-angle semantics; plan at 0.53 m.
    steering_response_scale: 1.0
    reverse_steering_response_scale: 0.80
    require_steering_calibration: true
    steering_command_gain_expected: 1.92
    steering_command_deadband_expected: 0.23
    steering_command_limit_expected: 0.35
    prefer_straight_entry: true
    max_planning_turn_radius: 0.58
    entry_outward_penalty: 3.0
    hold_entry_path: false
    validate_parking_space: true
    # Reject circuitous loops around the parking area. Zero disables this bound.
    max_entry_path_length: 4.0
    path_tracking_margin: 0.02
    slot_map_enabled: true
    slot_initial_right_only: true
    slot_columns: 3
    slot_rows: 2
    slot_width: 0.50
    slot_depth: 0.60
    slot_border: 0.02
    slot_match_tolerance: 0.18
    slot_fit_max_error: 0.10
    slot_ambiguity_margin: 0.02
    boundary_tolerance: 0.12
    automatic_target_selection: true
    pair_fallback_enabled: true
    target_heading_step: 0.08726646259971647
    center_stop_tolerance: 0.03
    pair_stop_tolerance: 0.05
    auto_exit_after_parking: true
    exit_to_grid_edge: true
    exit_grid_margin: 0.10
    exit_lane_tolerance: 0.20
    exit_arrival_yaw_tolerance: 0.35
    exit_planning_timeout: 1.2
    exit_start_speed: 0.05
    exit_steering_settle_time: 0.40
    arrival_use_rear_axle: true
    rear_axle_offset_x: -0.10
    rear_axle_offset_y: 0.0
    # Slot occupancy chooses a target; only measured/remembered obstacles block motion.
    block_occupied_slots: false
    enclosed_space_detection: true
    continuous_replanning: true
    require_complete_entry_path: true
    control_preview_time: 0.40
    enclosure_min_objects: 3
    enclosure_confirm_objects: 5
    enclosure_grid_resolution: 0.05
    enclosure_support_radius: 1.0
    goal_update_gain: 0.25
    goal_update_step: 0.08
    max_turn_arc_length: 0.70
    require_path_heading: false
    require_parking_heading: false
    parking_position_tolerance: 0.07
    # Zero disables software slew limiting: publish the target angle immediately.
    max_steering_rate: 0.0
    require_goal_heading: false
