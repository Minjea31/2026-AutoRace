parking_node:
  ros__parameters:
    recognition_frames: 2
    exit_on_lane_reacquired: true
    exit_lane_timeout_sec: 0.25
    exit_lane_min_confidence: 0.10
    white_roi_enabled: true
    white_roi_left: 0.050
    white_roi_right: 0.950
    white_roi_top: 0.961
    white_roi_bottom: 1.000
    white_roi_minimum_ratio: 0.08
    white_image_topic: /camera/color/image_raw/compressed
    white_image_timeout_sec: 0.30
    white_image_hz: 10.0
    lane_white_config: ''
    lane_white_node: /lane_fusion_node
    sign_timeout: 0.5
    scan_timeout: 0.5
    base_frame: base_link
    lidar_frame: laser_link
    lidar_x: 0.103
    lidar_y: 0.0
    lidar_yaw: 0.0
    cluster_distance: 0.12
    cluster_min_points: 3
    max_range: 3.0
    min_cluster_size: 0.08
    max_cluster_size: 0.70
    # Parking row runs along the initial forward axis; bays are on its right.
    # Right/left is fixed at mission start, including after the vehicle turns.
    row_yaw: 0.0
    row_tolerance: 0.16
    max_gap: 1.10
    vehicle_length: 0.322
    vehicle_width: 0.220
    wheelbase: 0.200
    max_steering: 0.408
    clearance: 0.04
    # Initial 30 cm around the robot must be clear of unobserved obstacles.
    # All observed returns still participate in collision checks in this area.
    initial_clear_radius: 0.30
    allow_reverse: false
    # Cruise speed magnitude; departure uses negative speed along the inbound trace.
    parking_speed: 1.0
    parking_hold_seconds: 3.0
    # Reverse the recorded entry turn until aligned with the approach lane.
    exit_heading_tolerance: 0.05
    max_deceleration: 1.0
    max_yaw_rate: 1.0
    lookahead: 0.18
    control_hz: 20.0
    plan_period: 1.5
    planning_timeout: 1.0
