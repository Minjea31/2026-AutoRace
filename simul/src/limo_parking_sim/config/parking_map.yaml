# Absolute map coordinates, extracted from assets/2026Track 도면.pdf CAD geometry.
# 3 columns x 2 rows. Clear spaces are 500 x 600 mm; overall 1580 x 1240 mm.
size: [10.0, 6.0]
texture: track.png
boundary_wall:
  height: 0.30
  thickness: 0.05  # Extends outward; the inside faces follow the mat edges.
  color: [0.015, 0.015, 0.015, 1.0]
parking:
  columns: 3
  rows: 2
  bay_width: 0.5
  bay_depth: 0.6
  line_width: 0.02
  outer_size: [1.58, 1.24]
  # Inside edges of the upper middle rectangle; CAD export rounding < 0.4 mm.
  goal: [6.630275, 7.129977, 3.970155, 4.570188]  # xmin,xmax,ymin,ymax
obstacles:
  # Practice arrangement requested by user: both sides and all three inner bays.
  # The upper middle bay remains empty for the user's parking algorithm.
  - {name: parked_left, pose: [6.360085, 4.270171, 1.5707963267948966]}
  - {name: parked_right, pose: [7.400167, 4.270171, 1.5707963267948966]}
  - {name: parked_inner_left, pose: [6.360085, 3.649864, 1.5707963267948966]}
  - {name: parked_inner_middle, pose: [6.880126, 3.649864, 1.5707963267948966]}
  - {name: parked_inner_right, pose: [7.400167, 3.649864, 1.5707963267948966]}
avoidance_layout:
  # User reference, numbered from left to right. These are placement metadata;
  # no coloured cells, numbers or grid lines are rendered.
  x_min: 4.268
  x_max: 8.030
  columns: 8
  row_y: {upper: 1.46, middle: 0.94, lower: 0.42}
  occupied: {upper: [3, 8], middle: [4, 5, 7], lower: [2, 6]}
sign_geometry:
  total_height: 0.20  # Includes the complete 90 mm sign plate, not a 200 mm pole.
  diameter: 0.09
  print_diameter: 0.08
  thickness: 0.01
  post_width: 0.01
sign:
  pose: [6.20, 4.52, 3.141592653589793]  # beside the y=4.570 white line
signs:
  - {name: speed_bump_sign, asset: speed-bump.png, pose: [2.50, 5.89, 3.141592653589793]}
  - {name: slow_sign, asset: slow.png, pose: [3.05, 5.89, 3.141592653589793]}
  - {name: zigzag_slow_sign, asset: slow.png, pose: [9.27, 4.46, 1.5707963267948966]}
  - {name: pedestrian_sign, asset: pedestrian.png, pose: [9.27, 2.54, 1.5707963267948966]}
fork:
  pose: [4.10, 0.94, 0.0]  # at the pointed island shown by the user; faces approach
  default: left
  assets: {left: fork-left-a.png, right: fork-right-b.png}
cones: []  # Optional additional individually placed cones.
cone_course:
  # Two full S waves between the original stop lines, beyond both road edges.
  # The first/last base edges touch the two stop-line inside edges exactly.
  # Hard course: cones and the vehicle may cross both painted road edges.
  start_line_y: 1.86
  end_line_y: 3.92
  center_x: 0.72
  layout: double_s
  amplitude: 0.20  # Cone rows swing 40 cm peak-to-peak.
  half_waves: 4  # Two complete S waves: right-left-right-left.
  phase_deg: -90
  half_width: 0.32  # Horizontal row separation; room for a feasible LIMO path.
  reference_amplitude: 0.048  # Validation only; never commands the live vehicle.
  pairs: 24
  cone: {height: 0.18, radius: 0.038, top_radius: 0.005, base_size: 0.08, base_height: 0.008}
speed_bump:
  pose: [3.65, 5.58, 0.0]
  length: 0.16
  width: 0.50
  height: 0.018  # below the LIMO Pro's 24 mm chassis clearance
traffic_light:
  pose: [3.17, 4.49, 3.141592653589793]
  width: 0.12  # Overall width including the side brackets, as in the reference.
  height: 0.205  # Signal body only; the stand adds another 50 mm.
  center_height: 0.1525  # Body bottom 0.05 m, top 0.255 m above the mat.
  housing_width: 0.08
  thickness: 0.035
  lens_diameter: 0.054
  base_size: [0.08, 0.10, 0.006]
  default: red
advertisement:
  pose: [3.17, 4.28, 3.141592653589793]
  width: 0.17
  height: 0.12
  center_height: 0.50
spawns:
  parking: [5.50, 4.84, 0.0]
  track: [0.65, 5.58, 0.0]
  slow: [1.60, 5.58, 0.0]
  crosswalk: [9.58, 3.35, -1.5707963267948966]
  obstacle: [8.55, 0.94, 3.141592653589793]
  fork: [4.85, 0.94, 3.141592653589793]
  cone: [0.72, 1.90, 1.2750887584551238]
  signal: [1.80, 4.84, 0.0]
