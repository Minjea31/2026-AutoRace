mux:
  ros__parameters:
    publish_rate_hz: 30.0
    input_timeout_sec: 0.25
    future_tolerance_sec: 0.05
    require_stamp: true
    # LIMO driver uses a 0.2 m wheelbase. Tune limits for the actual vehicle.
    wheelbase_m: 0.2
    max_forward_speed_mps: 0.5
    max_reverse_speed_mps: 0.3
    max_steering_angle_rad: 0.4886921906  # 28 degrees
    max_yaw_rate_rps: 1.5
    max_acceleration_mps2: 1.0
    max_deceleration_mps2: 2.0
    output_topic: /cmd_vel
    topics:
      crosswalk: /mission/crosswalk/command_01
      signal: /mission/signal/command_02
      parking: /mission/parking/command_03
      cone: /mission/cone/command_04
      objavoid: /mission/objavoid/command_05
      slow: /mission/slow/command_08
      lane: /mission/lane
