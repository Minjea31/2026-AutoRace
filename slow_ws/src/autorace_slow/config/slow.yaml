slow_node:
  ros__parameters:
    confirm_frames: 2
    # 시간은 autorace_slow/node.py 맨 위의 START_DELAY_SEC, SLOW_HOLD_SEC, BUMP_HOLD_SEC에서 조정.
    white_roi_enabled: true
    # Ratios of the original camera image: shallow strip near the vehicle.
    white_roi_left: 0.050
    white_roi_right: 0.950
    white_roi_top: 0.961
    white_roi_bottom: 1.000
    white_roi_minimum_ratio: 0.08
    white_image_topic: /camera/color/image_raw/compressed
    white_image_timeout_sec: 0.30
    white_image_hz: 10.0
    # Read HSV values from the real lane config, then follow the live lane node.
    lane_white_config: ''
    lane_white_node: /lane_fusion_node
